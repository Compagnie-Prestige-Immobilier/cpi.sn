# cpi.sn — deployment via Dokploy.
#
# One service. Postgres is NOT defined here: it is managed by Dokploy
# (`cpisn-db-udk1lq`) and reached over the internal network. Bundling a second
# Postgres would mean an unused container holding an empty volume, and an easy
# way to point the app at the wrong database.
#
# Local development does not use this file — run `bun run dev` (or `npm run dev`)
# against a local Postgres instead.
#
# Environment comes from Dokploy's manager; see .env.prod for the values:
#   DATABASE_URI · PAYLOAD_SECRET · NEXT_PUBLIC_SERVER_URL

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      MEDIA_DIR: /app/media
    volumes:
      # The ONLY copy of client uploads. Include it in Dokploy's backup set
      # alongside the database — a redeploy destroys anything written into the
      # container filesystem itself.
      - media:/app/media
    expose:
      - '3000'
    healthcheck:
      # Verifies the database is reachable, not merely that the process booted.
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  media:
# If Dokploy's Postgres lives on a different Docker network, attach it here —
# otherwise the hostname `cpisn-db-udk1lq` will not resolve from this container:
#
# networks:
#   default:
#     name: dokploy-network
#     external: true
