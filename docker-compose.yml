# CPI.sn — Dokploy deployment.
#
# Dokploy supplies the reverse proxy and TLS, so no ports are published to the
# host here; it attaches to the `web` service on 3000.
#
# Set in Dokploy's environment manager (never committed):
#   POSTGRES_PASSWORD, PAYLOAD_SECRET, NEXT_PUBLIC_SERVER_URL

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://cpi:${POSTGRES_PASSWORD}@db:5432/cpi
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      MEDIA_DIR: /app/media
    volumes:
      # Uploads MUST live on this volume, never the container filesystem —
      # anything written into the container is destroyed on redeploy.
      # Back this up alongside pgdata. See CLAUDE.md → Deployment rule 3.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this gate the web container races Postgres on first boot and
      # crash-loops through its restart policy.
      test: ['CMD-SHELL', 'pg_isready -U cpi -d cpi']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
